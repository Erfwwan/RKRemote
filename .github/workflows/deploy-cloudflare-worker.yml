name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - feature/remote-agent-foundation
    paths:
      - "cloudflare/worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"

permissions:
  contents: read

concurrency:
  group: rkremote-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish RKRemote relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Deploy Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -n 1 || true)"
          if [[ -n "$WORKER_URL" ]]; then
            echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"
            {
              echo "## RKRemote Worker deployed"
              echo
              echo "- Worker URL: `$WORKER_URL`"
              echo "- App endpoint: `wss://${WORKER_URL#https://}`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## RKRemote Worker deploy command succeeded"
              echo
              echo "Wrangler did not print a workers.dev URL. Check the deployment log and your Cloudflare Workers dashboard."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
